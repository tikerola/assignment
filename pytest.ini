[pytest]
testpaths = tests
python_files = test_*.py

# --base-url as a CLI flag, not the dedicated `base_url =` key -- that key doesn't propagate to
# pytest-xdist workers correctly. Change this to point the suite elsewhere.
# --output is its own subdirectory, not results/ itself: pytest-playwright deletes and never
# recreates its --output dir each session, which would race with results/report.html when
# every test passes and no artifact folder is ever recreated.
addopts = -v --base-url=https://www.saucedemo.com --html=results/report.html --self-contained-html
    --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure
    --output=results/artifacts

markers =
    regression: the full functional suite -- run with `pytest -m regression`, or just `pytest`
    smoke: small, fast, curated critical-path subset -- run with `pytest -m smoke`
